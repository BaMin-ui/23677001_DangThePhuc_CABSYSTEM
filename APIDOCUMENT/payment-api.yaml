openapi: 3.0.3
info:
  title: CAB System API - Payment & Fare Module
  description: API tính cước, khởi tạo thanh toán và xử lý webhook từ Payment Gateway.
  version: "1.0.0"

servers:
  - url: https://api.cabsystem.abc.vn/v1
    description: Production

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      schema: { type: string }
    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        enum: [application/json]
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: "400 Bad Request"
    NotFound:
      description: "404 Not Found"
    ServiceUnavailable:
      description: "503 Service Unavailable"

tags:
  - name: Payment & Fare
    description: Xử lý tiền cước và giao dịch thanh toán

paths:
  /trips/{trip_id}/fare:
    get:
      tags: [Payment & Fare]
      summary: Lấy chi tiết tính cước chuyến đi
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: trip_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{trip_id}/payments:
    post:
      tags: [Payment & Fare]
      summary: Khởi tạo thanh toán chuyến đi
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/ContentTypeHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - name: trip_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [cash, e_payment] }
                payment_token: { type: string }
      responses:
        '201':
          description: Created
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /payments/{payment_id}:
    get:
      tags: [Payment & Fare]
      summary: Tra cứu trạng thái giao dịch
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: payment_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/webhook:
    post:
      tags: [Payment & Fare]
      summary: Webhook nhận kết quả từ cổng thanh toán
      parameters:
        - name: X-Signature
          in: header
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_gateway_ref: { type: string }
                status: { type: string, enum: [SUCCESS, FAILED] }
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'

security:
  - BearerAuth: []
