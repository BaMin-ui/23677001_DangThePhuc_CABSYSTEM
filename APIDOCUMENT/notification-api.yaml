openapi: 3.0.3
info:
  title: CAB System API - Notification Module
  description: API quản lý thông báo người dùng và cấu hình kênh thông báo mới.
  version: "1.0.0"

servers:
  - url: https://api.cabsystem.abc.vn/v1
    description: Production

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      schema: { type: string }
    ContentTypeHeader:
      name: Content-Type
      in: header
      required: true
      schema:
        type: string
        enum: [application/json]

  responses:
    BadRequest:
      description: "400 Bad Request"
    Unauthorized:
      description: "401 Unauthorized"
    Forbidden:
      description: "403 Forbidden"

tags:
  - name: Notification
    description: Quản lý thông báo và kênh gửi

paths:
  /notifications:
    get:
      tags: [Notification]
      summary: Lấy danh sách thông báo của người dùng
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: recipient_type
          in: query
          schema: { type: string, enum: [customer, driver] }
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/notification-channels:
    post:
      tags: [Notification]
      summary: Đăng ký/thêm kênh thông báo mới
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/ContentTypeHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_name, provider, config]
              properties:
                channel_name: { type: string }
                provider: { type: string }
                config: { type: object }
      responses:
        '201':
          description: Created
        '403':
          $ref: '#/components/responses/Forbidden'

security:
  - BearerAuth: []
