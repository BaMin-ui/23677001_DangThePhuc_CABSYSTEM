openapi: 3.0.3
info:
  title: CAB System API - Matching Module
  description: API phục vụ kiểm soát và vận hành hệ thống tìm kiếm, phân công tài xế.
  version: "1.0.0"

servers:
  - url: https://api.cabsystem.abc.vn/v1
    description: Production

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: "401 Unauthorized"
    NotFound:
      description: "404 Not Found"

  schemas:
    Trip:
      type: object
      properties:
        trip_id: { type: string }
        status: { type: string }

tags:
  - name: Matching
    description: Quản lý thuật toán tìm kiếm tài xế

paths:
  /trips/{trip_id}/matching:
    get:
      tags: [Matching]
      summary: Xem trạng thái tìm kiếm tài xế
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: trip_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  trip_id: { type: string }
                  matching_status: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /trips/{trip_id}/matching/cancel:
    post:
      tags: [Matching]
      summary: Dừng tìm tài xế và chuyển trạng thái NO_DRIVER_FOUND
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - name: trip_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '409':
          description: Conflict

security:
  - BearerAuth: []
