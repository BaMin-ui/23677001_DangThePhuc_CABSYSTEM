  /admin/trips/{trip_id}/resolve:
    post:
      tags: [Admin - Trips]
      operationId: adminResolveTrip
      summary: Hỗ trợ xử lý sự cố chuyến đi
      description: |
        - `FORCE_COMPLETE`: buộc hoàn thành chuyến (chỉ khi chuyến đang `IN_PROGRESS`).
        - `FORCE_CANCEL`: buộc hủy chuyến chưa kết thúc.
        - `REASSIGN_DRIVER`: gán lại tài xế; nếu bỏ trống `new_driver_id`, hệ thống chạy lại matching.

        `reason` được lưu vào audit log. Trả `409` khi trạng thái hiện tại của chuyến không cho phép hành động.
      x-fr: [FR-28]
      x-br: [BR-09]
      x-ac: [AC-14]
      x-roles: [STAFF, ADMIN]
      parameters:
        - $ref: '#/components/parameters/AuthorizationHeader'
        - $ref: '#/components/parameters/ContentTypeHeader'
        - name: trip_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [FORCE_COMPLETE, FORCE_CANCEL, REASSIGN_DRIVER] }
                reason: { type: string, minLength: 5 }
                new_driver_id:
                  type: string
                  description: Chỉ dùng với REASSIGN_DRIVER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

